version: "3.9"

services:
  db:
    image: postgres:15
    container_name: aurora_db
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "3005:5432"   # << Postgres acessível pelo host na porta 3005
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: aurora_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      # a aplicação fala com o serviço interno "db" na porta 5432 (não muda)
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo
      APP_MODULE: ${APP_MODULE:-app.main:app}
    command: >
      gunicorn -k uvicorn.workers.UvicornWorker ${APP_MODULE}
      -b 0.0.0.0:8000 --workers 2 --threads 8 --timeout 60
    ports:
      - "80:8000"     # API em http://SEU_IP_PUBLICO

volumes:
  pg_data:
